name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The artwork, item icons and habitat pictures are not committed — about 110 MB
      # over ~2,300 files. Cache them between runs so only the first build pays the
      # download cost, and Serebii is not re-crawled on every push.
      - name: Cache downloaded pictures
        uses: actions/cache@v4
        with:
          path: |
            src/sprites/art
            src/sprites/items
            src/sprites/habitats
            src/sprites/outfits
            src/sprites/moves
            src/sprites/builds
            src/sprites/patterns
            src/sprites/records
          key: pokopia-pictures-v7

      - name: Download missing pictures
        run: node scripts/sprites.mjs

      - name: Build site
        # BASE_PATH must match the repo name for a project Pages site
        # (github.io/<repo>/). It is empty for a user/organisation site.
        env:
          BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '' || format('/{0}', github.event.repository.name) }}
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
